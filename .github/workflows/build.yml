# Builds the firmware for the four supported boards, runs the host tests and
# checks the formatting (clang-format, ruff) on every push and pull request.
# The .uf2 files are kept as build artifacts.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PICO_SDK_VERSION: 2.2.0
  ARM_GCC_VERSION: 14.2.Rel1
  # Pinned: other versions format some lines differently
  CLANG_FORMAT_VERSION: 21.1.8
  RUFF_VERSION: 0.17.3

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico_w, pico2, pico2_w]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check out the Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: true  # TinyUSB, and cyw43-driver and lwIP for the W boards

      - name: Install the Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_GCC_VERSION }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The W boards build the web interface in (SMC_WEB_INTERFACE_SUPPORT=AUTO), off
      # until `set web on`
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk

      - name: Build
        run: cmake --build build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SMCX-${{ matrix.board }}
          path: |
            build/SMCX.uf2
            build/SMCX.elf

  tests:
    name: Host tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev

      - name: Build
        run: |
          cmake -S tests -B build-tests -G Ninja
          cmake --build build-tests

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  lint:
    name: Formatting and lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format and ruff
        run: pip install clang-format==${{ env.CLANG_FORMAT_VERSION }} ruff==${{ env.RUFF_VERSION }}

      # The C++ sources and the tests, against .clang-format. Fix locally with
      # clang-format -i --style=file <files>
      - name: clang-format
        run: git ls-files 'src/*.cpp' 'src/*.hpp' 'src/*.h' 'tests/*.cpp' 'tests/*.hpp' 'tests/*.h' | xargs clang-format --dry-run --Werror --style=file

      # The Python tools, with ruff.toml. Fix locally with ruff check --fix . and ruff format .
      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .
